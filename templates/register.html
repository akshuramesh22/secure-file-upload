{% extends "base.html" %}{% block body %}
<div class="card auth"><div class="shield">🛡️</div><h2>Create account</h2>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="text" name="username" placeholder="Username (letters and digits)" required autofocus>
<input type="password" name="password" placeholder="Password (10+ characters)" required>
<button class="full">Sign up</button></form>
<p class="mut" style="text-align:center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div>
{% endblock %}
